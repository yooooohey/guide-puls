<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>施設記録アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
    }
    .spinner {
      border: 3px solid #f3f4f6;
      border-top: 3px solid #4f46e5;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-4">
  <div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8">
      <!-- ヘッダー -->
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center">
          <svg class="w-8 h-8 text-indigo-600 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">施設記録アプリ</h1>
        </div>
        <button id="settingsBtn" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
          <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
        </button>
      </div>

      <!-- 設定パネル -->
      <div id="settingsPanel" class="mb-6 p-4 bg-gray-50 rounded-lg border-2 border-gray-200 hidden">
        <h2 class="text-lg font-semibold text-gray-800 mb-3">Google Apps Script URL設定</h2>
        <div class="flex gap-2">
          <input
            type="text"
            id="gasUrlInput"
            placeholder="https://script.google.com/macros/s/..."
            class="flex-1 px-4 py-2 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          />
          <button
            id="saveUrlBtn"
            class="px-6 py-2 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition-colors"
          >
            保存
          </button>
        </div>
        <p class="mt-2 text-sm text-gray-600">デプロイしたGoogle Apps ScriptのWeb AppのURLを入力してください</p>
      </div>

      <!-- フォーム -->
      <div class="space-y-6">
        <!-- ファイル選択 -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            写真・動画 <span class="text-red-500">*</span>
          </label>
          <input
            type="file"
            id="fileInput"
            accept="image/*,video/*"
            capture="environment"
            multiple
            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          />
          <div id="fileList" class="mt-2 hidden">
            <p class="text-sm text-indigo-600 font-semibold"></p>
            <ul class="mt-1 text-xs text-gray-600"></ul>
          </div>
        </div>

        <!-- 場所 -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">場所</label>
          <input
            type="text"
            id="location"
            placeholder="例: 2階廊下"
            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          />
        </div>

        <!-- 現在状況 -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">現在状況</label>
          <input
            type="text"
            id="status"
            placeholder="例: 壁の塗装剥がれ"
            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          />
        </div>

        <!-- 初見 -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">初見</label>
          <textarea
            id="findings"
            placeholder="詳細な状況を記載..."
            rows="3"
            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none"
          ></textarea>
        </div>

        <!-- 備考 -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">備考</label>
          <textarea
            id="remarks"
            placeholder="その他の情報..."
            rows="3"
            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none"
          ></textarea>
        </div>

        <!-- 発見者 -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">発見者</label>
          <select
            id="staffId"
            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent bg-white"
          >
            <option value="">選択してください</option>
          </select>
        </div>

        <!-- メモ -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">メモ</label>
          <textarea
            id="memo"
            placeholder="録画に関するメモ..."
            rows="2"
            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none"
          ></textarea>
        </div>

        <!-- メッセージ -->
        <div id="message" class="hidden"></div>

        <!-- 送信ボタン -->
        <button
          id="submitBtn"
          class="w-full bg-indigo-600 text-white py-4 px-6 rounded-lg font-semibold hover:bg-indigo-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center justify-center"
        >
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
          </svg>
          記録する
        </button>
      </div>

      <!-- セットアップ案内 -->
      <div class="mt-6 p-4 bg-blue-50 border-2 border-blue-200 rounded-lg">
        <p class="text-sm text-blue-800">
          <strong>セットアップ手順:</strong><br />
          1. Google Apps Scriptコードをデプロイ<br />
          2. デプロイURLを右上の設定アイコンから登録<br />
          3. このHTMLファイルをスマホでアクセス可能な場所に配置
        </p>
      </div>
    </div>
  </div>

  <script>
    let selectedFiles = [];
    let gasUrl = localStorage.getItem('gasUrl') || '';
    let staffList = [];

    // 初期化
    document.addEventListener('DOMContentLoaded', () => {
      if (gasUrl) {
        document.getElementById('gasUrlInput').value = gasUrl;
        loadStaffList();
      } else {
        document.getElementById('settingsPanel').classList.remove('hidden');
      }

      // イベントリスナー
      document.getElementById('settingsBtn').addEventListener('click', toggleSettings);
      document.getElementById('saveUrlBtn').addEventListener('click', saveUrl);
      document.getElementById('fileInput').addEventListener('change', handleFileChange);
      document.getElementById('submitBtn').addEventListener('click', handleSubmit);
    });

    function toggleSettings() {
      const panel = document.getElementById('settingsPanel');
      panel.classList.toggle('hidden');
    }

    function saveUrl() {
      const input = document.getElementById('gasUrlInput');
      gasUrl = input.value.trim();
      if (gasUrl) {
        localStorage.setItem('gasUrl', gasUrl);
        document.getElementById('settingsPanel').classList.add('hidden');
        showMessage('success', 'GAS URLを保存しました');
        loadStaffList();
      }
    }

    async function loadStaffList() {
      try {
        const response = await fetch(gasUrl + '?action=getStaffList');
        const data = await response.json();
        
        if (data.success) {
          staffList = data.data;
          updateStaffSelect();
        } else {
          console.error('スタッフリスト取得失敗:', data.message);
        }
      } catch (error) {
        console.error('スタッフリスト取得エラー:', error);
      }
    }

    function updateStaffSelect() {
      const select = document.getElementById('staffId');
      select.innerHTML = '<option value="">選択してください</option>';
      staffList.forEach(staff => {
        const option = document.createElement('option');
        option.value = staff.staffId;
        option.textContent = staff.name;
        select.appendChild(option);
      });
    }

    function handleFileChange(e) {
      selectedFiles = Array.from(e.target.files);
      const fileListDiv = document.getElementById('fileList');
      
      if (selectedFiles.length > 0) {
        fileListDiv.classList.remove('hidden');
        const p = fileListDiv.querySelector('p');
        const ul = fileListDiv.querySelector('ul');
        
        p.textContent = `${selectedFiles.length}件のファイルを選択中`;
        ul.innerHTML = '';
        
        selectedFiles.forEach(file => {
          const li = document.createElement('li');
          li.className = 'truncate';
          li.textContent = `${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
          ul.appendChild(li);
        });
      } else {
        fileListDiv.classList.add('hidden');
      }
      
      hideMessage();
    }

    async function handleSubmit() {
      if (!gasUrl) {
        showMessage('error', 'Google Apps Script URLを設定してください');
        document.getElementById('settingsPanel').classList.remove('hidden');
        return;
      }

      if (selectedFiles.length === 0) {
        showMessage('error', '写真または動画を選択してください');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner mr-2"></div>アップロード中...';
      hideMessage();

      try {
        const fileDataArray = [];
        for (const file of selectedFiles) {
          const fileData = await convertFileToBase64(file);
          fileDataArray.push(fileData);
        }

        const payload = {
          location: document.getElementById('location').value,
          status: document.getElementById('status').value,
          findings: document.getElementById('findings').value,
          remarks: document.getElementById('remarks').value,
          staffId: document.getElementById('staffId').value,
          memo: document.getElementById('memo').value,
          files: fileDataArray
        };

        const response = await fetch(gasUrl, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          showMessage('success', `記録完了!\n\n施設整備ID: ${result.maintenanceId}\n${result.uploadedFiles.length}件のファイルをアップロードしました。`);
          resetForm();
        } else {
          showMessage('error', 'エラー: ' + result.message);
        }
      } catch (error) {
        console.error('エラー:', error);
        showMessage('error', 'エラーが発生しました: ' + error.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>記録する';
      }
    }

    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const base64 = reader.result.split(',')[1];
          resolve({
            name: file.name,
            data: base64,
            mimeType: file.type
          });
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function showMessage(type, text) {
      const messageDiv = document.getElementById('message');
      const isSuccess = type === 'success';
      
      messageDiv.className = `p-4 rounded-lg flex items-start ${
        isSuccess ? 'bg-green-50 border-2 border-green-200' : 'bg-red-50 border-2 border-red-200'
      }`;
      
      const icon = isSuccess 
        ? '<svg class="w-5 h-5 text-green-600 mt-0.5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>'
        : '<svg class="w-5 h-5 text-red-600 mt-0.5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
      
      messageDiv.innerHTML = `
        ${icon}
        <p class="text-sm whitespace-pre-line ${isSuccess ? 'text-green-800' : 'text-red-800'}">${text}</p>
      `;
      
      messageDiv.classList.remove('hidden');
    }

    function hideMessage() {
      document.getElementById('message').classList.add('hidden');
    }

    function resetForm() {
      document.getElementById('location').value = '';
      document.getElementById('status').value = '';
      document.getElementById('findings').value = '';
      document.getElementById('remarks').value = '';
      document.getElementById('staffId').value = '';
      document.getElementById('memo').value = '';
      document.getElementById('fileInput').value = '';
      selectedFiles = [];
      document.getElementById('fileList').classList.add('hidden');
    }
  </script>
</body>
</html>

    <link rel="manifest"
        href='data:application/manifest+json;utf8,{"name":"ガイドぷらす","short_name":"ガイドぷらす","start_url":".","display":"standalone","background_color":"#030712","theme_color":"#030712","icons":[{"src":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzIyYzU1ZSIvPjx0ZXh0IHg9IjUwIiB5PSI2MCIgZm9udC1zaXplPSI1MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0id2hpdGUiPuaXpTwvdGV4dD48L3N2Zz4=","sizes":"192x192","type":"image/svg+xml"}]}'>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

        .animate-spin-slow {
            animation: spin 3s linear infinite;

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- アイコン ---
        const Icon = ({ size = 24, className = "", children, title }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {title && <title>{title}</title>}
                {children}
            </svg>
        );
        const Play = (p) => <Icon {...p}><polygon points="5 3 19 12 5 21 5 3"></polygon></Icon>;
        const Pause = (p) => <Icon {...p}><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></Icon>;
        const Square = (p) => <Icon {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></Icon>;
        const Mic = (p) => <Icon {...p}><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" x2="12" y1="19" y2="22"></line></Icon>;
        const MicOff = (p) => <Icon {...p}><line x1="2" x2="22" y1="2" y2="22"></line><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"></path><path d="M5 10v2a7 7 0 0 0 12 5"></path><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"></path><path d="M9 9v3a3 3 0 0 0 5.12 2.12"></path><line x1="12" x2="12" y1="19" y2="22"></line></Icon>;
        const Settings = (p) => <Icon {...p}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></Icon>;
        const MusicIcon = (p) => <Icon {...p}><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></Icon>;
        const Volume2 = (p) => <Icon {...p}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></Icon>;
        const FolderOpen = (p) => <Icon {...p}><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"></path></Icon>;
        const RefreshCcw = (p) => <Icon {...p}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 21v-5h5"></path></Icon>;
        const Sliders = (p) => <Icon {...p}><line x1="4" x2="4" y1="21" y2="14"></line><line x1="4" x2="4" y1="10" y2="3"></line><line x1="12" x2="12" y1="21" y2="12"></line><line x1="12" x2="12" y1="8" y2="3"></line><line x1="20" x2="20" y1="21" y2="16"></line><line x1="20" x2="20" y1="12" y2="3"></line><line x1="1" x2="7" y1="14" y2="14"></line><line x1="9" x2="15" y1="8" y2="8"></line><line x1="17" x2="23" y1="16" y2="16"></line></Icon>;
        const Activity = (p) => <Icon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></Icon>;
        const Shuffle = (p) => <Icon {...p}><polyline points="16 3 21 3 21 8"></polyline><line x1="4" x2="21" y1="20" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" x2="21" y1="15" y2="21"></line><line x1="4" x2="9" y1="4" y2="9"></line></Icon>;
        const Menu = (p) => <Icon {...p}><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="18" y2="18"></line></Icon>;
        const X = (p) => <Icon {...p}><line x1="18" x2="6" y1="6" y2="18"></line><line x1="6" x2="18" y1="6" y2="18"></line></Icon>;
        const TrendingUp = (p) => <Icon {...p}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></Icon>;

        const DEFAULT_PADS = Array.from({ length: 16 }).map((_, i) => ({
            id: i,
            type: i < 8 ? 'music' : 'se',
            label: i < 8 ? `Music ${i + 1}` : `SE ${i - 7}`,
            fileName: '',
            volume: 1.0,
            loop: false,
            useFade: i < 8 ? true : false
        }));

        function App() {
            const [activeTab, setActiveTab] = useState('main');
            const [pads, setPads] = useState(DEFAULT_PADS);
            const [availableFiles, setAvailableFiles] = useState([]);
            const [isLoading, setIsLoading] = useState(false);

            const [musicVolume, setMusicVolume] = useState(0.8);
            const [soundVolume, setSoundVolume] = useState(0.8);
            const [masterVolume, setMasterVolume] = useState(1.0);
            const [masterGain, setMasterGain] = useState(1.0);

            const [globalFadeTime, setGlobalFadeTime] = useState(2.0);
            const [isCrossfade, setIsCrossfade] = useState(true);
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            const [micSettings, setMicSettings] = useState({ active: false, volume: 0.8, reverb: 0.0, pitch: 1.0 });
            const [playingStatus, setPlayingStatus] = useState(Array(16).fill('stopped'));

            const audioCtxRef = useRef(null);
            const musicMasterRef = useRef(null);
            const soundMasterRef = useRef(null);
            const micMasterRef = useRef(null);
            const mainMixRef = useRef(null);
            const masterGainRef = useRef(null);
            const masterVolumeRef = useRef(null);

            const audioBuffersRef = useRef(new Map());
            const activeNodesRef = useRef(new Map());

            const micStreamRef = useRef(null);
            const micSourceRef = useRef(null);
            const reverbBufferRef = useRef(null);
            const micConvolverRef = useRef(null);
            const micPitchFilterRef = useRef(null);
            const micDryGainRef = useRef(null);
            const micWetGainRef = useRef(null);
            const micVolumeGainRef = useRef(null);

            const initAudio = useCallback(() => {
                if (audioCtxRef.current) {
                    if (audioCtxRef.current.state === 'suspended') {
                        audioCtxRef.current.resume();
                    }
                    return;
                }

                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                audioCtxRef.current = ctx;

                mainMixRef.current = ctx.createGain();
                masterGainRef.current = ctx.createGain();
                masterGainRef.current.gain.value = masterGain;
                masterVolumeRef.current = ctx.createGain();
                masterVolumeRef.current.gain.value = masterVolume;

                mainMixRef.current.connect(masterGainRef.current);
                masterGainRef.current.connect(masterVolumeRef.current);
                masterVolumeRef.current.connect(ctx.destination);

                musicMasterRef.current = ctx.createGain();
                musicMasterRef.current.connect(mainMixRef.current);

                soundMasterRef.current = ctx.createGain();
                soundMasterRef.current.connect(mainMixRef.current);

                micMasterRef.current = ctx.createGain();
                micMasterRef.current.connect(mainMixRef.current);

                const sampleRate = ctx.sampleRate;
                const length = sampleRate * 2.5;
                const impulse = ctx.createBuffer(2, length, sampleRate);
                const left = impulse.getChannelData(0);
                const right = impulse.getChannelData(1);
                for (let i = 0; i < length; i++) {
                    const decay = Math.exp(-i / (sampleRate * 0.4));
                    left[i] = (Math.random() * 2 - 1) * decay;
                    right[i] = (Math.random() * 2 - 1) * decay;
                }
                reverbBufferRef.current = impulse;
            }, [masterGain, masterVolume]);

            useEffect(() => {
                if (musicMasterRef.current) musicMasterRef.current.gain.value = musicVolume;
            }, [musicVolume]);
            useEffect(() => {
                if (soundMasterRef.current) soundMasterRef.current.gain.value = soundVolume;
            }, [soundVolume]);
            useEffect(() => {
                if (masterVolumeRef.current) masterVolumeRef.current.gain.value = masterVolume;
            }, [masterVolume]);
            useEffect(() => {
                if (masterGainRef.current) masterGainRef.current.gain.value = masterGain;
            }, [masterGain]);

            useEffect(() => {
                if (micVolumeGainRef.current) micVolumeGainRef.current.gain.value = micSettings.volume;
                if (micDryGainRef.current) micDryGainRef.current.gain.value = 1 - micSettings.reverb;
                if (micWetGainRef.current) micWetGainRef.current.gain.value = micSettings.reverb;

                if (micPitchFilterRef.current) {
                    const p = micSettings.pitch;
                    if (p === 1.0) {
                        micPitchFilterRef.current.gain.value = 0;
                    } else if (p > 1.0) {
                        micPitchFilterRef.current.frequency.value = 2000 * p;
                        micPitchFilterRef.current.gain.value = 10 * (p - 1);
                    } else {
                        micPitchFilterRef.current.frequency.value = 300 / p;
                        micPitchFilterRef.current.gain.value = 15 * (1 - p);
                    }
                }
            }, [micSettings]);

            const toggleMic = async () => {
                initAudio();
                if (micSettings.active) {
                    micStreamRef.current?.getTracks().forEach(t => t.stop());
                    micSourceRef.current?.disconnect();
                    micSourceRef.current = null;
                    setMicSettings(p => ({ ...p, active: false }));
                } else {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        micStreamRef.current = stream;
                        const ctx = audioCtxRef.current;
                        micSourceRef.current = ctx.createMediaStreamSource(stream);

                        if (!micConvolverRef.current) {
                            micPitchFilterRef.current = ctx.createBiquadFilter();
                            micPitchFilterRef.current.type = 'peaking';
                            micPitchFilterRef.current.Q.value = 3;

                            micConvolverRef.current = ctx.createConvolver();
                            micConvolverRef.current.buffer = reverbBufferRef.current;

                            micDryGainRef.current = ctx.createGain();
                            micWetGainRef.current = ctx.createGain();
                            micVolumeGainRef.current = ctx.createGain();
                        }

                        micSourceRef.current.connect(micPitchFilterRef.current);
                        micPitchFilterRef.current.connect(micDryGainRef.current);
                        micPitchFilterRef.current.connect(micConvolverRef.current);
                        micConvolverRef.current.connect(micWetGainRef.current);
                        micDryGainRef.current.connect(micVolumeGainRef.current);
                        micWetGainRef.current.connect(micVolumeGainRef.current);
                        micVolumeGainRef.current.connect(micMasterRef.current);

                        setMicSettings(p => ({ ...p, active: true }));
                    } catch (err) {
                        alert("マイクのアクセスが拒否されたか、エラーが発生しました。");
                        console.error(err);
                    }
                }
            };

            const handleDirectorySelect = async (e) => {
                initAudio();
                const files = Array.from(e.target.files).filter(f => f.type.startsWith('audio/') || f.name.endsWith('.mp3') || f.name.endsWith('.wav'));
                setAvailableFiles(files);
                setIsLoading(true);

                for (const file of files) {
                    if (!audioBuffersRef.current.has(file.name)) {
                        try {
                            const arrayBuffer = await file.arrayBuffer();
                            const audioBuffer = await audioCtxRef.current.decodeAudioData(arrayBuffer);
                            audioBuffersRef.current.set(file.name, audioBuffer);
                        } catch (err) {
                            console.error("Failed to decode:", file.name);
                        }
                    }
                }
                setIsLoading(false);
            };

            const playPad = (padId) => {
                initAudio();
                const pad = pads[padId];
                if (!pad.fileName) return;

                const buffer = audioBuffersRef.current.get(pad.fileName);
                if (!buffer) return;

                const ctx = audioCtxRef.current;
                const now = ctx.currentTime;
                const existingNode = activeNodesRef.current.get(padId);

                let offset = 0;
                if (existingNode && playingStatus[padId] === 'paused') {
                    offset = existingNode.pausedAt;
                }

                if (existingNode && playingStatus[padId] === 'playing') {
                    existingNode.source.onended = null;
                    existingNode.source.stop(now);
                    offset = 0;
                }

                const isMusic = pad.type === 'music';
                let isSwitching = false;
                const toStop = [];

                if (isMusic) {
                    pads.filter(p => p.type === 'music' && p.id !== padId).forEach(p => {
                        const otherNode = activeNodesRef.current.get(p.id);
                        if (otherNode && (playingStatus[p.id] === 'playing' || playingStatus[p.id] === 'paused')) {
                            isSwitching = true;
                            toStop.push({ id: p.id, node: otherNode });
                        }
                    });
                }

                toStop.forEach(({ id, node }) => {
                    node.source.onended = null;
                    if (isCrossfade && globalFadeTime > 0) {
                        node.fadeGain.gain.cancelScheduledValues(now);
                        node.fadeGain.gain.setValueAtTime(node.fadeGain.gain.value, now);
                        node.fadeGain.gain.linearRampToValueAtTime(0, now + globalFadeTime);
                        node.source.stop(now + globalFadeTime);
                        setTimeout(() => { activeNodesRef.current.delete(id); }, globalFadeTime * 1000);
                    } else {
                        node.source.stop(now);
                        activeNodesRef.current.delete(id);
                    }
                });

                const source = ctx.createBufferSource();
                source.buffer = buffer;
                source.loop = pad.loop;

                const volumeGain = ctx.createGain();
                volumeGain.gain.value = pad.volume;

                const fadeGain = ctx.createGain();

                source.connect(volumeGain);
                volumeGain.connect(fadeGain);

                const targetMaster = isMusic ? musicMasterRef.current : soundMasterRef.current;
                fadeGain.connect(targetMaster);

                let shouldFadeIn = false;
                if (isMusic) {
                    if (isSwitching) {
                        shouldFadeIn = isCrossfade && globalFadeTime > 0;
                    } else {
                        shouldFadeIn = pad.useFade && globalFadeTime > 0;
                    }
                }

                if (shouldFadeIn && offset === 0) {
                    fadeGain.gain.setValueAtTime(0, now);
                    fadeGain.gain.linearRampToValueAtTime(1, now + globalFadeTime);
                } else {
                    fadeGain.gain.setValueAtTime(1, now);
                }

                source.start(now, offset);

                source.onended = () => {
                    setPlayingStatus(prev => {
                        const active = activeNodesRef.current.get(padId);
                        if (active && active.source === source && prev[padId] === 'playing') {
                            const next = [...prev];
                            next[padId] = 'stopped';
                            activeNodesRef.current.delete(padId);
                            return next;
                        }
                        return prev;
                    });
                };

                activeNodesRef.current.set(padId, {
                    source, fadeGain, startTime: now, offsetBase: offset, settings: pad, bufferDuration: buffer.duration
                });

                setPlayingStatus(prev => {
                    const next = [...prev];
                    toStop.forEach(({ id }) => { next[id] = 'stopped'; });
                    next[padId] = 'playing';
                    return next;
                });
            };

            const pausePad = (padId) => {
                const node = activeNodesRef.current.get(padId);
                if (!node) return;

                const { source, startTime, offsetBase, settings, bufferDuration } = node;
                const now = audioCtxRef.current.currentTime;

                const playedTime = now - startTime;
                let newOffset = offsetBase + playedTime;

                if (settings.loop && bufferDuration) {
                    newOffset = newOffset % bufferDuration;
                }

                source.onended = null;
                source.stop();

                activeNodesRef.current.set(padId, { ...node, pausedAt: newOffset });

                setPlayingStatus(prev => {
                    const next = [...prev];
                    next[padId] = 'paused';
                    return next;
                });
            };

            const stopPad = (padId) => {
                const node = activeNodesRef.current.get(padId);
                if (!node) {
                    setPlayingStatus(prev => { const n = [...prev]; n[padId] = 'stopped'; return n; });
                    return;
                }

                const { source, fadeGain, settings } = node;
                const now = audioCtxRef.current.currentTime;

                source.onended = null;

                const isMusic = settings.type === 'music';
                const shouldFadeOut = isMusic && settings.useFade && globalFadeTime > 0;

                if (playingStatus[padId] === 'playing' && shouldFadeOut) {
                    fadeGain.gain.cancelScheduledValues(now);
                    fadeGain.gain.setValueAtTime(fadeGain.gain.value, now);
                    fadeGain.gain.linearRampToValueAtTime(0, now + globalFadeTime);
                    source.stop(now + globalFadeTime);

                    setPlayingStatus(prev => { const n = [...prev]; n[padId] = 'stopped'; return n; });
                    setTimeout(() => { activeNodesRef.current.delete(padId); }, globalFadeTime * 1000);
                } else {
                    source.stop();
                    activeNodesRef.current.delete(padId);
                    setPlayingStatus(prev => { const n = [...prev]; n[padId] = 'stopped'; return n; });
                }
            };

            const updatePad = (id, key, value) => {
                setPads(prev => prev.map(p => p.id === id ? { ...p, [key]: value } : p));
            };

            const PadComponent = ({ pad }) => {
                const status = playingStatus[pad.id];
                const isPlaying = status === 'playing';
                const isPaused = status === 'paused';

                const baseColor = pad.type === 'music'
                    ? (isPlaying ? 'bg-blue-600 border-blue-300 shadow-[0_0_15px_rgba(96,165,250,0.8)]' : 'bg-gray-800 border-gray-700 hover:border-blue-500')
                    : (isPlaying ? 'bg-orange-600 border-orange-300 shadow-[0_0_15px_rgba(251,146,60,0.8)]' : 'bg-gray-800 border-gray-700 hover:border-orange-500');

                const handleMainClick = () => {
                    if (isPlaying) pausePad(pad.id);
                    else playPad(pad.id);
                };

                const toggleLoop = (e) => {
                    e.stopPropagation();
                    updatePad(pad.id, 'loop', !pad.loop);
                };

                return (
                    <div className={`relative flex flex-col justify-between p-2 md:p-3 rounded-xl border-2 transition-all select-none h-full w-full
                ${baseColor} ${!pad.fileName && 'opacity-50 grayscale'}`}
                    >
                        <div className="flex justify-between items-start mb-1">
                            <div className="text-xs md:text-sm font-bold text-gray-100 truncate pr-6">{pad.label}</div>
                            <button
                                onClick={(e) => { e.stopPropagation(); stopPad(pad.id); }}
                                className="absolute top-1.5 right-1.5 md:top-2 md:right-2 p-1.5 md:p-2 bg-red-600 hover:bg-red-500 rounded-md shadow-lg transition-transform active:scale-90 z-10"
                                title={pad.type === 'music' && pad.useFade ? "フェードアウト停止" : "停止"}
                            >
                                <Square size={16} className="text-white fill-current md:w-[16px] md:h-[16px] w-[12px] h-[12px]" />
                            </button>
                        </div>

                        <div
                            className="flex-1 flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-transform min-h-0"
                            onClick={handleMainClick}
                        >
                            <div className="text-[10px] md:text-xs text-gray-300 truncate w-full text-center mb-1 font-medium">
                                {pad.fileName || '未設定'}
                            </div>
                            {isPlaying ? <Pause size={28} className="text-white md:w-9 md:h-9" /> : <Play size={28} className="text-white ml-1 md:w-9 md:h-9" />}
                        </div>

                        <div className="flex justify-between items-center pt-1 border-t border-white/10 shrink-0">
                            <div className="text-[9px] md:text-[10px] font-bold uppercase tracking-wider text-white/70">
                                {isPlaying ? 'Playing' : isPaused ? 'Paused' : 'Ready'}
                            </div>
                            <div className="flex gap-1.5 md:gap-2">
                                {pad.type === 'music' && (
                                    <button
                                        onClick={(e) => { e.stopPropagation(); updatePad(pad.id, 'useFade', !pad.useFade); }}
                                        className={`p-1 md:p-1.5 rounded transition-colors
                                    ${pad.useFade ? 'bg-blue-500 text-white shadow-[0_0_8px_rgba(59,130,246,0.5)]' : 'bg-gray-900/50 text-gray-500'}`}
                                        title="ONで単独再生・停止時にフェード効果"
                                    >
                                        <TrendingUp size={12} className="md:w-3.5 md:h-3.5" />
                                    </button>
                                )}
                                <button
                                    onClick={toggleLoop}
                                    className={`p-1 md:p-1.5 rounded transition-colors
                                ${pad.loop ? 'bg-green-500 text-white shadow-[0_0_8px_rgba(34,197,94,0.5)]' : 'bg-gray-900/50 text-gray-500'}`}
                                    title="ループ"
                                >
                                    <RefreshCcw size={12} className={pad.loop ? "animate-spin-slow md:w-3.5 md:h-3.5" : "md:w-3.5 md:h-3.5"} />
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="h-[100dvh] w-full overflow-hidden bg-gray-950 text-gray-100 font-sans flex flex-col relative">

                    {isMenuOpen && (
                        <div className="absolute inset-0 z-50 flex">
                            <div className="absolute inset-0 bg-black/50" onClick={() => setIsMenuOpen(false)}></div>
                            <div className="relative w-64 md:w-80 bg-gray-900 h-full border-r border-gray-800 p-4 flex flex-col gap-6 shadow-2xl overflow-y-auto">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-xl font-bold text-white">メニュー</h2>
                                    <button onClick={() => setIsMenuOpen(false)} className="text-gray-400 hover:text-white p-1">
                                        <X size={24} />
                                    </button>
                                </div>
                                <div className="flex flex-col gap-2">
                                    <button
                                        onClick={() => { setActiveTab('main'); setIsMenuOpen(false); }}
                                        className={`p-3 rounded-lg text-left font-bold transition-colors ${activeTab === 'main' ? 'bg-green-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}`}
                                    >
                                        メイン画面
                                    </button>
                                    <button
                                        onClick={() => { setActiveTab('settings'); setIsMenuOpen(false); }}
                                        className={`p-3 rounded-lg text-left font-bold transition-colors ${activeTab === 'settings' ? 'bg-green-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}`}
                                    >
                                        <div className="flex items-center gap-2"><Settings size={18} /> 設定</div>
                                    </button>
                                </div>
                                <div className="w-full h-px bg-gray-800 my-2"></div>
                                <div className="flex flex-col gap-3">
                                    <div className="flex items-center gap-2 text-yellow-400">
                                        <Sliders size={18} />
                                        <span className="font-bold text-sm">音楽のフェード時間設定</span>
                                    </div>
                                    <div className="flex items-center gap-3 bg-gray-800/80 px-4 py-3 rounded-lg border border-gray-700">
                                        <input type="range" min="0" max="5" step="0.5" value={globalFadeTime} onChange={(e) => setGlobalFadeTime(parseFloat(e.target.value))} className="flex-1 accent-yellow-400" />
                                        <span className="text-sm text-gray-300 w-8 text-right">{globalFadeTime.toFixed(1)}s</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="bg-gray-900 border-b border-gray-800 p-2 md:p-3 flex gap-3 md:gap-4 shrink-0 items-center">
                        <button
                            onClick={() => setIsMenuOpen(true)}
                            className="p-1.5 md:p-2 bg-gray-800 border border-gray-700 rounded-lg text-gray-300 hover:text-white hover:bg-gray-700 transition-colors shrink-0"
                        >
                            <Menu size={20} className="md:w-6 md:h-6" />
                        </button>

                        <div className="flex flex-nowrap overflow-x-auto gap-2 md:gap-4 scrollbar-hide items-center w-full">
                            <div className="flex items-center gap-2 md:gap-4 bg-gray-800/80 px-2 md:px-4 py-1.5 md:py-2 rounded-xl border border-gray-700 shrink-0 ml-auto">
                                <div className="flex flex-col gap-0.5 md:gap-1">
                                    <label className="text-[9px] md:text-[10px] font-bold text-gray-400">MASTER VOL</label>
                                    <div className="flex items-center gap-1.5 md:gap-2">
                                        <Volume2 size={14} className="text-white md:w-4 md:h-4" />
                                        <input type="range" min="0" max="1" step="0.01" value={masterVolume} onChange={(e) => setMasterVolume(parseFloat(e.target.value))} className="w-16 md:w-24 accent-green-500" />
                                    </div>
                                </div>
                                <div className="w-px h-6 md:h-8 bg-gray-700"></div>
                                <div className="flex flex-col gap-0.5 md:gap-1">
                                    <label className="text-[9px] md:text-[10px] font-bold text-gray-400">MASTER GAIN</label>
                                    <div className="flex items-center gap-1.5 md:gap-2">
                                        <Activity size={14} className="text-yellow-400 md:w-4 md:h-4" />
                                        <input type="range" min="1" max="3" step="0.1" value={masterGain} onChange={(e) => setMasterGain(parseFloat(e.target.value))} className="w-12 md:w-20 accent-yellow-500" />
                                        <span className="text-[10px] md:text-xs text-gray-300 w-5 md:w-6">x{masterGain.toFixed(1)}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center gap-2 md:gap-4 bg-gray-800/80 px-2 md:px-4 py-1.5 md:py-2 rounded-xl border border-gray-700 shrink-0">
                                <button
                                    onClick={toggleMic}
                                    className={`flex items-center gap-1.5 md:gap-2 px-2 md:px-4 py-1 md:py-2 rounded-lg text-xs md:text-sm font-bold transition-colors
                                ${micSettings.active ? 'bg-red-500 text-white shadow-[0_0_10px_rgba(239,68,68,0.5)]' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`}
                                >
                                    {micSettings.active ? <Mic size={14} className="md:w-[18px] md:h-[18px]" /> : <MicOff size={14} className="md:w-[18px] md:h-[18px]" />}
                                    {micSettings.active ? 'MIC ON' : 'MIC OFF'}
                                </button>

                                <div className="flex flex-col gap-0.5 md:gap-1">
                                    <label className="text-[9px] md:text-[10px] font-bold text-gray-400">MIC VOL</label>
                                    <input type="range" min="0" max="1" step="0.01" value={micSettings.volume} onChange={(e) => setMicSettings(p => ({ ...p, volume: parseFloat(e.target.value) }))} className="w-12 md:w-20 accent-red-500" />
                                </div>
                                <div className="flex flex-col gap-0.5 md:gap-1">
                                    <label className="text-[9px] md:text-[10px] font-bold text-gray-400">REVERB</label>
                                    <input type="range" min="0" max="1" step="0.05" value={micSettings.reverb} onChange={(e) => setMicSettings(p => ({ ...p, reverb: parseFloat(e.target.value) }))} className="w-12 md:w-20 accent-purple-500" />
                                </div>
                                <div className="flex flex-col gap-0.5 md:gap-1">
                                    <label className="text-[9px] md:text-[10px] font-bold text-gray-400">PITCH</label>
                                    <input type="range" min="0.5" max="2.0" step="0.1" value={micSettings.pitch} onChange={(e) => setMicSettings(p => ({ ...p, pitch: parseFloat(e.target.value) }))} className="w-12 md:w-20 accent-cyan-500" />
                                </div>
                            </div>
                        </div>
                    </header>

                    {activeTab === 'main' && (
                        <div className="flex-1 flex flex-col p-2 md:p-4 gap-2 md:gap-4 overflow-hidden">
                            <div className="flex-1 flex flex-col bg-gray-900/40 rounded-xl border border-gray-800 p-2 md:p-4 min-h-0">
                                <div className="shrink-0 flex justify-between items-center mb-2 md:mb-4 gap-2 border-b border-gray-800 pb-2">
                                    <div className="flex items-center gap-2 md:gap-4 flex-1">
                                        <div className="flex items-center gap-1.5 md:gap-2 text-blue-400 shrink-0">
                                            <MusicIcon size={20} className="md:w-6 md:h-6" />
                                            <h2 className="text-base md:text-xl font-black tracking-wider">MUSIC</h2>
                                        </div>
                                        <div className="flex items-center gap-1.5 md:gap-2 bg-gray-800/80 px-2 md:px-4 py-1 md:py-2 rounded-lg border border-gray-700 shrink-0">
                                            <Volume2 size={14} className="text-blue-400 md:w-4 md:h-4" />
                                            <input type="range" min="0" max="1" step="0.01" value={musicVolume} onChange={(e) => setMusicVolume(parseFloat(e.target.value))} className="w-16 md:w-24 accent-blue-500" />
                                        </div>
                                    </div>

                                    <button
                                        onClick={() => setIsCrossfade(!isCrossfade)}
                                        className={`p-1.5 md:p-2 rounded-lg transition-colors border shrink-0
                                    ${isCrossfade ? 'bg-yellow-600 text-white border-yellow-500 shadow-[0_0_10px_rgba(202,138,4,0.5)]' : 'bg-gray-800 text-gray-500 border-gray-700'}`}
                                        title={`クロスフェード: ${isCrossfade ? 'ON' : 'OFF'}`}
                                    >
                                        <Shuffle size={16} className="md:w-5 md:h-5" />
                                    </button>
                                </div>

                                <div className="flex-1 grid grid-cols-4 grid-rows-2 gap-1.5 md:gap-3 min-h-0">
                                    {pads.filter(p => p.type === 'music').map(pad => (
                                        <PadComponent key={pad.id} pad={pad} />
                                    ))}
                                </div>
                            </div>

                            <div className="flex-1 flex flex-col bg-gray-900/40 rounded-xl border border-gray-800 p-2 md:p-4 min-h-0">
                                <div className="shrink-0 flex justify-between items-center mb-2 md:mb-4 gap-2 border-b border-gray-800 pb-2">
                                    <div className="flex items-center gap-2 md:gap-4">
                                        <div className="flex items-center gap-1.5 md:gap-2 text-orange-400 shrink-0">
                                            <Sliders size={20} className="md:w-6 md:h-6" />
                                            <h2 className="text-base md:text-xl font-black tracking-wider">SOUND EFFECTS</h2>
                                        </div>
                                        <div className="flex items-center gap-1.5 md:gap-2 bg-gray-800/80 px-2 md:px-4 py-1 md:py-2 rounded-lg border border-gray-700 shrink-0">
                                            <Volume2 size={14} className="text-orange-400 md:w-4 md:h-4" />
                                            <input type="range" min="0" max="1" step="0.01" value={soundVolume} onChange={(e) => setSoundVolume(parseFloat(e.target.value))} className="w-16 md:w-24 accent-orange-500" />
                                        </div>
                                    </div>
                                </div>

                                <div className="flex-1 grid grid-cols-4 grid-rows-2 gap-1.5 md:gap-3 min-h-0">
                                    {pads.filter(p => p.type === 'se').map(pad => (
                                        <PadComponent key={pad.id} pad={pad} />
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'settings' && (
                        <div className="flex-1 overflow-y-auto p-4 md:p-8 max-w-6xl mx-auto w-full">
                            <div className="bg-gray-800/50 border border-gray-700 rounded-xl p-6 mb-8">
                                <h3 className="text-lg font-bold mb-4 flex items-center gap-2 text-white">
                                    <FolderOpen size={20} className="text-yellow-400" /> 音源フォルダ一括読み込み
                                </h3>
                                <div className="flex flex-col sm:flex-row sm:items-center gap-4">
                                    <label className="cursor-pointer bg-green-600 hover:bg-green-500 text-white px-6 py-3 rounded-lg font-bold transition-colors text-center">
                                        フォルダを選択
                                        <input type="file" webkitdirectory="true" directory="true" multiple accept="audio/*" className="hidden" onChange={handleDirectorySelect} />
                                    </label>
                                    <div className="text-sm text-gray-300 bg-gray-900 px-4 py-2 rounded-lg">
                                        {isLoading ? '読み込み中...' : `ロード済: ${availableFiles.length} ファイル`}
                                    </div>
                                </div>
                            </div>

                            <h3 className="text-xl font-bold mb-4 text-white">各パッドの初期設定</h3>
                            <div className="space-y-4 pb-12">
                                {pads.map(pad => (
                                    <div key={pad.id} className="bg-gray-800 border border-gray-700 rounded-lg p-4 flex flex-col md:flex-row gap-4 items-center">

                                        <div className={`w-full md:w-24 text-center font-bold px-3 py-2 rounded text-sm tracking-wider
                                    ${pad.type === 'music' ? 'bg-blue-900/50 text-blue-300' : 'bg-orange-900/50 text-orange-300'}`}>
                                            {pad.type === 'music' ? 'MUSIC' : 'SE'} {pad.id % 8 + 1}
                                        </div>

                                        <div className="flex-1 flex flex-col gap-2 w-full md:min-w-[250px]">
                                            <input
                                                type="text" value={pad.label} onChange={(e) => updatePad(pad.id, 'label', e.target.value)}
                                                placeholder="表示名" className="bg-gray-900 text-white border border-gray-600 rounded px-3 py-2 text-sm w-full focus:border-green-500 focus:outline-none"
                                            />
                                            <select
                                                value={pad.fileName} onChange={(e) => updatePad(pad.id, 'fileName', e.target.value)}
                                                className="bg-gray-900 text-white border border-gray-600 rounded px-3 py-2 text-sm w-full focus:border-green-500 focus:outline-none"
                                            >
                                                <option value="">-- 音源を選択 --</option>
                                                {availableFiles.map((f, i) => (
                                                    <option key={i} value={f.name}>{f.name}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="flex items-center justify-center w-full md:w-auto bg-gray-900/50 p-3 rounded-lg md:ml-4">
                                            <div className="flex flex-col gap-1 w-full md:w-48">
                                                <label className="text-gray-400 flex justify-between text-sm">Volume <span>{Math.round(pad.volume * 100)}%</span></label>
                                                <input type="range" min="0" max="2" step="0.05" value={pad.volume} onChange={(e) => updatePad(pad.id, 'volume', parseFloat(e.target.value))} className="accent-gray-400" />
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            const swCode = `
        self.addEventListener('install', (e) => { self.skipWaiting(); });
        self.addEventListener('activate', (e) => { e.waitUntil(self.clients.claim()); });
        self.addEventListener('fetch', (e) => { });
      `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch((err) => {
                console.log('PWA Service Worker registration skipped or failed.', err);
            });
        }
    </script>
</body>

</html>
